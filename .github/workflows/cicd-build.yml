name: CICD Build
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: 0
      GO_PRIVATE: github.com/threatmate/*
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch tags
        run: |
          git fetch --tags --force  # Retrieve annotated tags.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Setup Golang module caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-golang-module-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golang-module-
      - name: Setup Golang install caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/bin
          key: ${{ runner.os }}-golang-install-${{ hashFiles('go.install') }}
          restore-keys: |
            ${{ runner.os }}-golang-install-
      - name: Build prep
        run: make clean
      - name: Build
        run: make -j${MAKE_THREADS} cicd-build

